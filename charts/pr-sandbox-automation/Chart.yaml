apiVersion: v2
name: pr-sandbox-automation
description: Automatically manage Open edX sandbox instances for PRs
type: application
version: 0.1.1
appVersion: "0.2.0"
dependencies:
  - name: mysql
    version: 9.14.1
    repository: https://charts.bitnami.com/bitnami
    condition: mysql.enabled
  - name: redis
    version: 24.1.3
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
