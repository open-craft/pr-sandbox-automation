{{- if and .Values.mysql.enabled .Values.mysql.connectionSecret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mysql.connectionSecret.name }}
  labels:
    {{- include "pr-sandbox-automation.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.mysql.connectionSecret.key }}: {{- /*
      Construct mysql+pymysql connection string for the app.
      Example: mysql+pymysql://user:password@host:3306/db
  */}}
    {{- $user := required "mysql.auth.username is required when mysql.connectionSecret.create is true" .Values.mysql.auth.username -}}
    {{- $password := required "mysql.auth.password is required when mysql.connectionSecret.create is true" .Values.mysql.auth.password -}}
    {{- $database := required "mysql.auth.database is required when mysql.connectionSecret.create is true" .Values.mysql.auth.database -}}
    {{- $host := include "pr-sandbox-automation.mysqlHost" . -}}
    {{- $port := .Values.mysql.connectionSecret.port | default 3306 -}}
    {{ printf "mysql+pymysql://%s:%s@%s:%d/%s" $user $password $host $port $database | quote }}
{{- end }}
