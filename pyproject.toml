[project]
name = "pr-sandbox-automation"
version = "0.1.0"
description = "Automatically manage Open edX sandbox instances for PRs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.1",
    "cryptography>=46.0.3",
    "fastapi[standard]>=0.120.4",
    "pydantic-settings>=2.11.0",
    "pyjwt>=2.10.1",
    "pymysql>=1.1.2",
    "requests>=2.32.5",
    "sqlmodel>=0.0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.14.3",
]
